<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5ecd8;
  --fg: #1f1a12;
  --muted: #7a6b52;
  --ink: #5d523f;
  --yellow: #ffe45c;
  --pink: #ffb3c7;
  --mint: #b8f0c8;
  --sky: #bfe3ff;
  --peach: #ffd9a8;
  --red: #ff4d2e;
  --red-dark: #c5341b;
  --shadow: 0 10px 24px rgba(60, 40, 10, .14);
  --sans: Fredoka, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --hand: Caveat, "Comic Sans MS", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
.tag { display: inline-flex; padding: 8px 16px; background: var(--fg); color: var(--bg); border-radius: 999px; font-size: 16px; font-weight: 600; transform: rotate(-2deg); }
.card { background: var(--yellow); border-radius: 6px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; color: var(--fg); }
.card .t { font-weight: 500; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.card .m { font-family: var(--hand); font-weight: 700; color: var(--ink); }
.card .m b { font-weight: 700; }
.c0 { background: var(--yellow); } .c1 { background: var(--pink); } .c2 { background: var(--mint); } .c3 { background: var(--sky); } .c4 { background: var(--peach); }
@keyframes drop { 0% { opacity: 0; transform: translateY(-40px) rotate(var(--r)) scale(1.06); } 60% { opacity: 1; transform: translateY(6px) rotate(var(--r)) scale(.99); } 100% { opacity: 1; transform: translateY(0) rotate(var(--r)); } }
.card { transform: rotate(var(--r, 0deg)); }
.card.new { animation: drop .55s cubic-bezier(.2,.9,.3,1.2) both; }
@media (prefers-reduced-motion: reduce) { .card.new { animation: none; } }

/* Téléphone */
.phone { max-width: 520px; margin: 0 auto; padding: 40px 20px 56px; display: flex; flex-direction: column; gap: 22px; }
.phone h1 { font-size: 34px; font-weight: 700; line-height: 1.05; margin: 14px 0 0; }
.phone form { display: flex; flex-direction: column; gap: 12px; }
.phone label { font-size: 14px; font-weight: 600; color: var(--muted); }
.phone input.field { width: 100%; padding: 14px 16px; background: #fff; border: 2px solid var(--fg); border-radius: 10px; font-size: 18px; outline: none; }
.phone input.field:focus { box-shadow: 0 0 0 3px var(--sky); }
.note { position: relative; margin-top: 6px; }
.note textarea { display: block; width: 100%; height: 170px; padding: 20px 18px 40px; background: var(--yellow); border: 0; border-radius: 6px; box-shadow: 0 14px 28px rgba(90, 60, 0, .18); transform: rotate(-1.5deg); font-size: 24px; font-weight: 500; line-height: 1.15; resize: none; outline: none; }
.note textarea:focus { box-shadow: 0 14px 28px rgba(90, 60, 0, .18), 0 0 0 3px var(--fg); }
.note .count { position: absolute; right: 18px; bottom: 14px; font-family: var(--hand); font-size: 20px; font-weight: 700; color: var(--ink); pointer-events: none; }
.send { margin-top: 14px; padding: 18px; background: var(--red); color: #fff; border: 0; border-radius: 999px; font-size: 20px; font-weight: 700; box-shadow: 0 8px 0 var(--red-dark); cursor: pointer; transition: transform .1s, box-shadow .1s; }
.send:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--red-dark); }
.send[disabled] { opacity: .45; cursor: default; box-shadow: 0 8px 0 var(--red-dark); transform: none; }
.status { min-height: 24px; font-family: var(--hand); font-size: 20px; font-weight: 700; color: var(--ink); text-align: center; }
.status.err { color: var(--red); }
.recent { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.recent h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0; }
.recent .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.recent .card { padding: 14px 16px; }
.recent .card .t { font-size: 17px; }
.recent .card .m { font-size: 17px; }
.empty { font-family: var(--hand); font-size: 22px; font-weight: 700; color: var(--ink); }

/* Borne */
body.borne { overflow: hidden; cursor: none; }
.wall { height: 100vh; height: 100dvh; padding: 48px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 720px; grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 72px; overflow: hidden; }
.wall .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.wall .top .tag { padding: 10px 22px; font-size: 22px; }
.wall .top .clock { font-size: 22px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.wall .latest { grid-column: 1; grid-row: 2; align-self: center; min-width: 0; }
.wall .latest .card { padding: 56px 60px 48px; border-radius: 10px; box-shadow: 0 24px 48px rgba(90, 60, 0, .18); gap: 24px; --r: -1.5deg; }
.wall .latest .t { font-size: clamp(40px, 5vw, 96px); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.wall .latest .m { font-size: clamp(24px, 2.3vw, 44px); }
.wall .older { grid-column: 2; grid-row: 2 / 4; position: relative; min-height: 0; }
.wall .older .card { position: absolute; width: 300px; padding: 22px 24px 20px; }
.wall .older .t { font-size: 26px; }
.wall .older .m { font-size: 22px; }
.wall .invite { grid-column: 1; grid-row: 3; display: flex; align-items: center; gap: 26px; }
.wall .invite .qr { width: 150px; height: 150px; padding: 12px; background: #fff; border-radius: 8px; box-shadow: var(--shadow); transform: rotate(3deg); }
.wall .invite .qr img, .wall .invite .qr canvas { width: 100%; height: 100%; display: block; }
.wall .invite p { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.2; }
.wall .invite p span { display: block; font-family: var(--hand); font-weight: 700; color: var(--muted); font-size: 30px; }
.wall .empty { font-size: 48px; line-height: 1.1; }
@media (max-width: 1200px) {
  .wall { grid-template-columns: minmax(0, 1fr) 380px; column-gap: 40px; padding: 32px; }
  .wall .older .card { width: 240px; padding: 16px 18px; }
  .wall .older .t { font-size: 20px; } .wall .older .m { font-size: 18px; }
}
@media (max-width: 900px) {
  .wall { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; padding: 24px; }
  .wall .older { display: none; }
  .wall .invite { grid-row: 3; }
  .wall .latest .card { padding: 32px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var TOPIC = "mur-bureau-85683771c9";
  var BASE = "https://ntfy.sh/" + TOPIC;
  var KEY = "mur.msgs";
  var NAME_KEY = "mur.name";
  var MAX_TEXT = 200, MAX_NAME = 24;
  var isBorne = /(^|[?&])borne/.test(location.search);
  var app = document.getElementById("app");
  var msgs = load();
  var seen = {};
  msgs.forEach(function (m) { seen[m.id] = true; });

  /* emplacements des post-it sur la borne : gauche, haut, rotation, opacité */
  var SLOTS = [
    [0, 10, 3, 1], [360, 40, -2, 1], [30, 250, -4, 1],
    [380, 290, 2, 1], [60, 500, 5, .7], [400, 540, -3, .55]
  ];

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(msgs.slice(-500))); } catch (e) {}
  }
  function hash(s) {
    var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function color(m) { return "c" + (hash(m.id) % 5); }
  function tilt(m, spread) { return (((hash(m.id + "r") % 100) / 100) * 2 * spread - spread).toFixed(1) + "deg"; }
  function parse(ev) {
    if (!ev || ev.event !== "message") return null;
    var body = { n: "", t: ev.message || "" };
    try { var j = JSON.parse(ev.message); if (j && typeof j.t === "string") body = j; } catch (e) {}
    var t = String(body.t || "").trim().slice(0, MAX_TEXT);
    if (!t) return null;
    return { id: ev.id, time: ev.time * 1000, n: String(body.n || "").trim().slice(0, MAX_NAME), t: t };
  }
  function add(m, fresh) {
    if (!m || seen[m.id]) return false;
    seen[m.id] = true;
    if (fresh) m.fresh = true;
    msgs.push(m);
    msgs.sort(function (a, b) { return a.time - b.time; });
    save();
    return true;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function ago(ts) {
    var d = (Date.now() - ts) / 1000;
    if (d < 60) return "à l'instant";
    if (d < 3600) return "il y a " + Math.floor(d / 60) + " min";
    if (d < 86400) return "il y a " + Math.floor(d / 3600) + " h";
    var day = new Date(ts), now = new Date();
    if (now.getDate() - day.getDate() === 1) return "hier";
    return day.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  }
  function meta(m) {
    return (m.n ? "<b>" + esc(m.n) + "</b>, " : "") + ago(m.time);
  }
  function cardHtml(m, style, tiltSpread) {
    var cls = "card " + color(m) + (m.fresh ? " new" : "");
    var st = "--r:" + tilt(m, tiltSpread) + ";" + (style || "");
    var html = '<div class="' + cls + '" style="' + st + '"><p class="t">' + esc(m.t) + '</p><div class="m">' + meta(m) + '</div></div>';
    m.fresh = false;
    return html;
  }
  function fetchHistory(cb) {
    fetch(BASE + "/json?poll=1&since=all").then(function (r) { return r.text(); }).then(function (txt) {
      var changed = false;
      txt.split("\n").forEach(function (line) {
        if (!line) return;
        try { if (add(parse(JSON.parse(line)))) changed = true; } catch (e) {}
      });
      if (cb) cb(changed);
    }).catch(function () { if (cb) cb(false); });
  }
  function subscribe(onNew) {
    if (!window.EventSource) return;
    var es;
    function open() {
      es = new EventSource(BASE + "/sse");
      es.onmessage = function (e) {
        try { if (add(parse(JSON.parse(e.data)), true)) onNew(); } catch (err) {}
      };
      es.onerror = function () { es.close(); setTimeout(open, 5000); };
    }
    open();
  }
  function post(n, t) {
    return fetch(BASE, { method: "POST", body: JSON.stringify({ n: n, t: t }) }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  /* ---------- Borne ---------- */
  function renderWall() {
    var list = msgs.slice().reverse();
    var latest = list[0], older = list.slice(1, 1 + SLOTS.length);
    app.innerHTML = '<div class="wall">'
      + '<div class="top"><span class="tag">Mur du bureau</span><span class="clock" id="clock"></span></div>'
      + '<div class="latest">' + (latest
        ? cardHtml(latest, "", 0)
        : '<div class="card empty" style="--r:-1.5deg; padding: 48px 56px">Rien encore.<br>Scanne le code et colle le premier mot.</div>') + '</div>'
      + '<div class="older">' + older.map(function (m, i) {
        var s = SLOTS[i];
        return cardHtml(m, "left:" + s[0] + "px;top:" + s[1] + "px;--r:" + s[2] + "deg;opacity:" + s[3], 0);
      }).join("") + '</div>'
      + '<div class="invite"><div class="qr" id="qr"></div><p>Un mot pour le bureau ?<span>Scanne, écris, ça se colle ici.</span></p></div>'
      + '</div>';
    tick();
    var url = location.origin + location.pathname;
    if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 126, height: 126, colorDark: "#1f1a12", correctLevel: QRCode.CorrectLevel.M });
  }
  function tick() {
    var el = document.getElementById("clock");
    if (el) el.textContent = new Date().toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  }
  function bootWall() {
    document.body.className = "borne";
    renderWall();
    setInterval(tick, 15000);
    setInterval(renderWall, 60000);
    fetchHistory(function (changed) { if (changed) renderWall(); });
    subscribe(renderWall);
    setInterval(function () { fetchHistory(function (c) { if (c) renderWall(); }); }, 120000);
    if (navigator.wakeLock && navigator.wakeLock.request) {
      var lock = function () { navigator.wakeLock.request("screen").catch(function () {}); };
      lock();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) lock(); });
    }
  }

  /* ---------- Téléphone ---------- */
  function renderRecent() {
    var el = document.getElementById("recent");
    if (!el) return;
    var list = msgs.slice().reverse().slice(0, 20);
    el.innerHTML = list.length
      ? '<div class="grid">' + list.map(function (m) { return cardHtml(m, "", 3); }).join("") + '</div>'
      : '<p class="empty">Rien encore. À toi.</p>';
  }
  function bootPhone() {
    var name = "";
    try { name = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
    app.innerHTML = '<div class="phone">'
      + '<div><span class="tag">Mur du bureau</span><h1>Colle un mot sur la borne</h1></div>'
      + '<form id="form">'
      + '<label for="name">Ton prénom</label>'
      + '<input class="field" id="name" placeholder="Prénom" maxlength="' + MAX_NAME + '" value="' + esc(name) + '" autocomplete="given-name">'
      + '<label for="text">Ton mot</label>'
      + '<div class="note"><textarea id="text" placeholder="Un mot, une idée, un merci" maxlength="' + MAX_TEXT + '"></textarea><span class="count" id="count">0 / ' + MAX_TEXT + '</span></div>'
      + '<button type="submit" class="send" id="send" disabled>Coller sur le mur</button>'
      + '</form>'
      + '<div class="status" id="status"></div>'
      + '<div class="recent"><h2>Déjà sur la borne</h2><div id="recent"></div></div>'
      + '</div>';
    var form = document.getElementById("form"), text = document.getElementById("text"), send = document.getElementById("send"),
        count = document.getElementById("count"), status = document.getElementById("status"),
        nameEl = document.getElementById("name");
    text.addEventListener("input", function () {
      count.textContent = text.value.length + " / " + MAX_TEXT;
      send.disabled = !text.value.trim();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var n = nameEl.value.trim().slice(0, MAX_NAME), t = text.value.trim().slice(0, MAX_TEXT);
      if (!t) return;
      try { localStorage.setItem(NAME_KEY, n); } catch (err) {}
      send.disabled = true; status.className = "status"; status.textContent = "Ça part…";
      post(n, t).then(function (ev) {
        add({ id: ev.id, time: ev.time * 1000, n: n, t: t }, true);
        text.value = ""; count.textContent = "0 / " + MAX_TEXT;
        status.textContent = "Collé sur la borne !";
        renderRecent();
        setTimeout(function () { status.textContent = ""; }, 3000);
      }).catch(function () {
        status.className = "status err"; status.textContent = "Ça n'est pas parti. Réessaie.";
        send.disabled = false;
      });
    });
    renderRecent();
    fetchHistory(function () { renderRecent(); });
    subscribe(renderRecent);
  }

  if (isBorne) bootWall(); else bootPhone();
})();
</script>
</body>
</html>
