<style>
/* ---------- Jetons ---------- */
:root {
  --bg: #f5ecd8; --fg: #1f1a12; --ink: #5d523f;
  --yellow: #ffe45c; --pink: #ffb3c7; --mint: #b8f0c8; --sky: #bfe3ff; --peach: #ffd9a8;
  --red: #ff4d2e; --red-dark: #c5341b; --white: #ffffff;
  --line: rgba(31, 26, 18, .22);
  --u: calc(100vmin / 1080);
  --shadow: 0 10px 24px rgba(60, 40, 10, .14);
  --sans: Fredoka, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --hand: Caveat, "Comic Sans MS", cursive;
  --ease-drop: cubic-bezier(.2, .9, .3, 1.2);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
}
@supports (width: 1dvmin) { :root { --u: calc(100dvmin / 1080); } }
@property --split { syntax: "<number>"; inherits: true; initial-value: 50; }
@property --gap { syntax: "<length>"; inherits: true; initial-value: 0px; }

/* ---------- Communs ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }

[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#etalon { position: absolute; left: 0; top: 0; width: calc(1000 * var(--u)); height: 0; visibility: hidden; pointer-events: none; }
.c-j { background: var(--yellow); } .c-r { background: var(--pink); } .c-p { background: var(--peach); }
.tag { display: inline-flex; padding: 8px 16px; background: var(--fg); color: var(--bg); border-radius: 999px; font-size: 16px; font-weight: 600; transform: rotate(-2deg); }
.n { display: inline-block; width: .58em; text-align: center; }
.nw { white-space: nowrap; }            /* un nombre ne se coupe jamais, le texte autour peut revenir à la ligne */
@keyframes drop { 0% { opacity: 0; transform: translateY(calc(-40 * var(--u))) rotate(var(--r)) scale(1.06); } 60% { opacity: 1; transform: translateY(6px) rotate(var(--r)) scale(.99); } 100% { opacity: 1; transform: translateY(0) rotate(var(--r)); } }

/* ---------- Duel (borne et téléphone) ---------- */
.duel { position: relative; height: calc(280 * var(--u)); --gap: calc(32 * var(--u)); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: calc(10 * var(--u)); transform: rotate(var(--r)); z-index: 4; overflow: hidden; pointer-events: none; }

.fill.eteint { opacity: .5; }
.pad { position: absolute; top: 0; bottom: 0; width: calc(50% - calc(16 * var(--u))); background: transparent; border: 0; padding: 0; margin: 0; z-index: 6; overflow: visible;
       color: var(--fg); cursor: pointer; -webkit-tap-highlight-color: transparent; }

.res .nom { font: 600 calc(36 * var(--u))/1.1 var(--sans); white-space: nowrap; }

.res .voix { font: 700 calc(32 * var(--u))/1.1 var(--hand); color: var(--ink); margin-top: calc(8 * var(--u)); white-space: nowrap; }
.date .n, .total .n { width: .6em; } .etat .n { width: .48em; }

       opacity: 0; z-index: 5; pointer-events: none; }
.milieu { position: absolute; left: 50%; top: calc(-14 * var(--u)); bottom: calc(-14 * var(--u)); width: calc(4 * var(--u)); margin-left: calc(-2 * var(--u)); opacity: 0; z-index: 7; pointer-events: none; }
.milieu::before, .milieu::after { content: ""; position: absolute; left: 0; width: calc(4 * var(--u)); height: calc(14 * var(--u)); background: var(--fg); }

             background: var(--red); box-shadow: 0 calc(3 * var(--u)) 0 var(--red-dark); opacity: 0; z-index: 7; pointer-events: none; }

          font: 700 calc(40 * var(--u))/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--fg); opacity: .92; }

.coin { position: absolute; bottom: 0; width: calc(88 * var(--u)); height: calc(88 * var(--u)); transform: scale(0); filter: drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(60, 40, 10, .25)); }

.duel-tel { height: 112px; --gap: 12px; margin: 4px 0 10px; }

#directTxt:focus { outline: none; }
#actualiser { height: 44px; padding: 0 16px; background: transparent; border: 2px solid var(--fg); border-radius: 999px; font: 600 15px/1 var(--sans); color: var(--fg); cursor: pointer; }
.recent { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }

.card { border-radius: 6px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; color: var(--fg); transform: rotate(var(--r, 0deg)); }

/* ---------- Borne ---------- */

.wall { height: 100vh; height: 100dvh; display: grid; overflow: hidden; }

#alerte { font: 500 calc(24 * var(--u))/1.1 var(--sans); color: var(--red-dark); text-wrap: balance; }

         box-shadow: 0 calc(24 * var(--u)) calc(48 * var(--u)) rgba(90, 60, 0, .18); --r: -1.5deg; transform: rotate(var(--r)); color: var(--fg); }

.punaise { position: absolute; top: calc(-12 * var(--u)); left: 50%; width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin-left: calc(-15 * var(--u)); border-radius: 50%; background: var(--red); box-shadow: 0 calc(3 * var(--u)) 0 var(--red-dark); z-index: 3; }

          display: flex; flex-direction: column; gap: calc(8 * var(--u)); transform: rotate(var(--rot, 0deg)); margin-top: var(--dy, 0px); color: var(--fg); }
.postit.vide { display: none; }
.photos { grid-area: pile; justify-self: start; align-self: start; display: flex; align-items: flex-start; gap: calc(28 * var(--u)); min-width: 0; max-width: 100%; padding-top: calc(16 * var(--u)); pointer-events: none; }

.photo img { display: block; height: calc(220 * var(--u)); width: auto; max-width: 100%; object-fit: contain; border-radius: calc(2 * var(--u)); }

.mur { display: contents; }

  font: 700 calc(40 * var(--u))/1 var(--sans); box-shadow: 0 calc(8 * var(--u)) 0 var(--red-dark); -webkit-tap-highlight-color: transparent; transition: transform .1s, box-shadow .1s; }

  box-shadow: 0 calc(30 * var(--u)) calc(60 * var(--u)) rgba(31, 26, 18, .35); display: flex; flex-direction: column; gap: calc(18 * var(--u)); transform: rotate(-.6deg); }
